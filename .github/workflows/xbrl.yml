name: XBRL Financials (daily)

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 3am PDT / 6am EDT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (extract + validate, no writes)'
        type: boolean
        default: false
      max_ciks:
        description: 'Cap CIKs processed (testing)'
        type: string
        default: ''

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Run XBRL financials ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          PYTHONPATH=. python3 -m backend.ingest_xbrl_facts \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ inputs.max_ciks != '' && format('--max-ciks {0}', inputs.max_ciks) || '' }}
