name: BreakingAlpha Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning or evening'
        default: 'morning'
        type: choice
        options: [morning, evening]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install groq

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
            echo "mode=morning" >> $GITHUB_OUTPUT
          else
            echo "mode=evening" >> $GITHUB_OUTPUT
          fi

      - name: Run pipeline
        working-directory: backend
        timeout-minutes: 90
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          # Feature flag read at backend/ingest.py:1167. Folds primary_company into
          # articles.companies[] at ingest (companies[] match field only;
          # company_mentions and mention_count stay frozen). Repo VARIABLE, not a
          # secret (it is a non-sensitive boolean). Off-safe: when the variable is
          # unset this renders an empty string, so the os.getenv check stays false
          # and the fold stays off. Set vars.TAGGING_PRIMARY_FOLD_ENABLED to true to
          # enable it on the next run.
          TAGGING_PRIMARY_FOLD_ENABLED: ${{ vars.TAGGING_PRIMARY_FOLD_ENABLED }}
          RELEVANCE_GRADE_MODE: ${{ vars.RELEVANCE_GRADE_MODE }}
          INGEST_BLOCKLIST_MODE: ${{ vars.INGEST_BLOCKLIST_MODE }}
          FILTER_PROMPT_CACHE: ${{ vars.FILTER_PROMPT_CACHE }}
          GRADER_SKIP_IRRELEVANT: ${{ vars.GRADER_SKIP_IRRELEVANT }}
          MARKET_PULSE_V2: ${{ vars.MARKET_PULSE_V2 }}
        run: python run.py ${{ steps.mode.outputs.mode }}

      # Alerting only (does NOT gate generation - the brief is already shipped by
      # the step above). Trigger (b): a run that exits CLEAN but ships a stub. This
      # reads the ACTUAL shipped brief from the DB, so it catches a stub regardless
      # of whether synthesize flagged it (the 2026-07-08 quota outage exited 0 while
      # shipping "Market Intelligence Unavailable" and stayed invisible for weeks).
      - name: Verify brief shipped (not a stub)
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%S)
          headline=$(curl -sS --get "${SUPABASE_URL}/rest/v1/briefings" \
            --data-urlencode "briefing_type=eq.${MODE}" \
            --data-urlencode "created_at=gte.${since}" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=1" \
            --data-urlencode "select=headline,created_at" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" | jq -r '.[0].headline // ""')
          echo "Latest fresh ${MODE} brief headline: '${headline}'"
          if [ -z "${headline}" ] || [ "${headline}" = "Market Intelligence Unavailable" ]; then
            echo "::error::No fresh ${MODE} brief in the last 3h, or it is a STUB. Likely a Gemini quota or synthesis failure; the site keeps serving the prior brief. Failing the job to alert."
            exit 1
          fi
          echo "Fresh ${MODE} brief shipped OK."

      # Trigger (a) + (b): fires on ANY failure - the pipeline step throwing / exiting
      # non-zero (including run.py's existing stub -> exit 1), OR the stub check above.
      # Opens a GitHub issue (same mechanism as grading.yml / outcome_evaluator.yml);
      # no new paid service, no billing or auto-reload change.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const mode = '${{ steps.mode.outputs.mode }}' || 'unknown';
            const day = new Date().toISOString().slice(0, 10);
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Brief pipeline failed (${mode}) - ${day}`,
              body: `The ${mode} brief pipeline failed or shipped a stub.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nA stub means the brief did not generate (e.g. Gemini quota exhausted); the site keeps serving the prior brief. This is an automatic notification.`,
              labels: ['brief-failure', 'automated']
            })
