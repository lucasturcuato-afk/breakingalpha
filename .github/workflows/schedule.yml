name: BreakingAlpha Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'morning or evening'
        default: 'morning'
        type: choice
        options: [morning, evening]

# The alerting steps below open GitHub issues via actions/github-script. That
# REQUIRES an explicit issues:write scope on the job token. Without it the
# github.rest.issues.create call throws "Resource not accessible by integration"
# and the alert silently no-ops. That is exactly what happened on 2026-07-23/24:
# run.py exited non-zero on the credit-depleted stub, the "Notify on failure"
# step RAN, but the create call failed for lack of this scope, so no issue was
# ever opened and the outage stayed invisible for days (see run 30098137174,
# step "Notify on failure": RequestError [HttpError]: Resource not accessible by
# integration). contents:read keeps checkout working under the tighter scope.
permissions:
  contents: read
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install groq

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 14 * * 1-5" ]; then
            echo "mode=morning" >> $GITHUB_OUTPUT
          else
            echo "mode=evening" >> $GITHUB_OUTPUT
          fi

      - name: Run pipeline
        working-directory: backend
        timeout-minutes: 90
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          # Feature flag read at backend/ingest.py:1167. Folds primary_company into
          # articles.companies[] at ingest (companies[] match field only;
          # company_mentions and mention_count stay frozen). Repo VARIABLE, not a
          # secret (it is a non-sensitive boolean). Off-safe: when the variable is
          # unset this renders an empty string, so the os.getenv check stays false
          # and the fold stays off. Set vars.TAGGING_PRIMARY_FOLD_ENABLED to true to
          # enable it on the next run.
          TAGGING_PRIMARY_FOLD_ENABLED: ${{ vars.TAGGING_PRIMARY_FOLD_ENABLED }}
          RELEVANCE_GRADE_MODE: ${{ vars.RELEVANCE_GRADE_MODE }}
          INGEST_BLOCKLIST_MODE: ${{ vars.INGEST_BLOCKLIST_MODE }}
          FILTER_PROMPT_CACHE: ${{ vars.FILTER_PROMPT_CACHE }}
          GRADER_SKIP_IRRELEVANT: ${{ vars.GRADER_SKIP_IRRELEVANT }}
          MARKET_PULSE_V2: ${{ vars.MARKET_PULSE_V2 }}
          # Tape-aware materiality re-rank, read at backend/synthesize.py:54.
          # Repo VARIABLE, not a secret (non-sensitive enum: off | shadow | active).
          # Off-safe: when the variable is UNSET this renders an empty string; the
          # synthesize.py guard coerces any non-{off,shadow,active} value to "off",
          # and both "off" and "shadow" leave the SERVED lead untouched (only
          # "active" replaces preselected before the hoist). So merging this changes
          # nothing until vars.MATERIALITY_RANK_MODE is set to active by a human.
          MATERIALITY_RANK_MODE: ${{ vars.MATERIALITY_RANK_MODE }}
          # Morning Brief email digest, read at backend/brief_email_send.py.
          # Repo VARIABLE, not a secret (non-sensitive enum: off | active).
          # Off-safe: when the variable is UNSET this renders an empty string,
          # digest_mode() folds anything that is not exactly "active" to "off",
          # and the send path returns before touching the DB, the network or the
          # renderer. Merging this mails nobody until a human sets
          # vars.EMAIL_DIGEST_MODE to active AND the deliverability checks in the
          # PR body have passed.
          EMAIL_DIGEST_MODE: ${{ vars.EMAIL_DIGEST_MODE }}
          # Transactional sender + link origin for that email. RESEND_API_KEY is
          # the same key the Next.js app already uses. NEXT_PUBLIC_SITE_URL is
          # needed here because the pipeline builds absolute unsubscribe and
          # adopt links; it falls back to https://signalera.ai (parity with
          # src/lib/email/site-url.ts) when unset.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_REPLY_TO: ${{ vars.EMAIL_REPLY_TO }}
          # Signs the unsubscribe token. MUST be the same value the Next.js
          # /api/unsubscribe route verifies with, or every footer link 400s.
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: python run.py ${{ steps.mode.outputs.mode }}

      # Alerting only (does NOT gate generation - the brief is already shipped by
      # the step above). Trigger (b): a run that exits CLEAN but ships a stub. This
      # reads the ACTUAL shipped brief from the DB, so it catches a stub regardless
      # of whether synthesize flagged it (the 2026-07-08 quota outage exited 0 while
      # shipping "Market Intelligence Unavailable" and stayed invisible for weeks).
      - name: Verify brief shipped (not a stub)
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%S)
          headline=$(curl -sS --get "${SUPABASE_URL}/rest/v1/briefings" \
            --data-urlencode "briefing_type=eq.${MODE}" \
            --data-urlencode "created_at=gte.${since}" \
            --data-urlencode "order=created_at.desc" \
            --data-urlencode "limit=1" \
            --data-urlencode "select=headline,created_at" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" | jq -r '.[0].headline // ""')
          echo "Latest fresh ${MODE} brief headline: '${headline}'"
          if [ -z "${headline}" ] || [ "${headline}" = "Market Intelligence Unavailable" ]; then
            echo "::error::No fresh ${MODE} brief in the last 3h, or it is a STUB. Likely a Gemini quota or synthesis failure; the site keeps serving the prior brief. Failing the job to alert."
            exit 1
          fi
          echo "Fresh ${MODE} brief shipped OK."

      # Trigger (a) + (b): fires on ANY failure - the pipeline step throwing / exiting
      # non-zero (including run.py's existing stub -> exit 1), OR the stub check above.
      # Opens a GitHub issue (same mechanism as grading.yml / outcome_evaluator.yml);
      # no new paid service, no billing or auto-reload change.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const mode = '${{ steps.mode.outputs.mode }}' || 'unknown';
            const day = new Date().toISOString().slice(0, 10);
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Brief pipeline failed (${mode}) - ${day}`,
              body: `The ${mode} brief pipeline failed or shipped a stub.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nA stub means the brief did not generate (e.g. Gemini quota exhausted); the site keeps serving the prior brief. This is an automatic notification.`,
              labels: ['brief-failure', 'automated']
            })

      # Read the ACTUAL shipped-pulse path this run took from the DB
      # (pipeline_runs.preselect_decision.pulse_shipped_path, written by
      # synthesize.py) and expose it to the credit-degradation alert below.
      # Mirrors #470's post-run DB read. Runs on always() so it captures the row
      # even when the pipeline step failed (the credit-depleted case exits
      # non-zero AND leaves pulse_shipped_path at its v2_off default). SELECT
      # only; no writes.
      - name: Read shipped pulse path
        if: always()
        id: pulsepath
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%S)
          row=$(curl -sS --get "${SUPABASE_URL}/rest/v1/pipeline_runs" \
            --data-urlencode "brief_type=eq.${MODE}" \
            --data-urlencode "started_at=gte.${since}" \
            --data-urlencode "order=started_at.desc" \
            --data-urlencode "limit=1" \
            --data-urlencode "select=preselect_decision" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          path=$(echo "${row}" | jq -r '.[0].preselect_decision.pulse_shipped_path // ""')
          v2on=$(echo "${row}" | jq -r '.[0].preselect_decision.market_pulse_v2_on // false')
          echo "shipped_path='${path}' market_pulse_v2_on='${v2on}'"
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          echo "v2on=${v2on}" >> "$GITHUB_OUTPUT"

      # Gemini credit-degradation alert. DISTINCT from the total-stub failure
      # above: pulse_shipped_path=v2_off means the dedicated V2 pulse call was
      # SKIPPED / never overwrote its default - the fingerprint of the Gemini
      # 429 RESOURCE_EXHAUSTED "prepayment credits are depleted" error killing
      # the pulse call (the exact signature in run 30098137174 on 2026-07-24).
      # This is the DEGRADATION signal that PRECEDES a full outage, and it is a
      # distinct failure mode from a total stub, so it gets its own label.
      # Balance is NOT programmatically readable (the google-genai SDK exposes no
      # billing/credits surface and the Gemini Developer API has no balance
      # endpoint - the 429 itself only points to the AI Studio console), so this
      # inferential signal is the most reliable available proxy for "credits ran
      # dry". Alerting only; it never gates or fails the run.
      - name: Alert on pulse-off (Gemini credit degradation)
        if: always() && steps.pulsepath.outputs.path == 'v2_off' && steps.pulsepath.outputs.v2on == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const mode = '${{ steps.mode.outputs.mode }}' || 'unknown';
            const day = new Date().toISOString().slice(0, 10);
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Market Pulse OFF - likely Gemini credit depletion (${mode}) - ${day}`,
              body: `The ${mode} brief shipped with pulse_shipped_path=v2_off while MARKET_PULSE_V2 is ON. That means the dedicated V2 market-pulse call was skipped or errored out before it could ship - the fingerprint of the Gemini 429 RESOURCE_EXHAUSTED "prepayment credits are depleted" error.\n\nThis is a DISTINCT, EARLIER signal than a total stub: it is the credit-degradation that precedes a full outage. Gemini prepay balance is NOT readable via API (console-only), so this is the most reliable inferential proxy for "credits are running dry". Run rate is ~$7.6/day; a depleted balance stops brief generation entirely within one run.\n\nACTION: check the Gemini/AI Studio billing console and load prepay credits. Auto-reload is intentionally OFF.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThis is an automatic notification.`,
              labels: ['pulse-off', 'gemini-credits', 'automated']
            })
