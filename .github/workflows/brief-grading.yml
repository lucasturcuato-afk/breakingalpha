name: Brief Call Grading

on:
  repository_dispatch:
    types: [grade-brief]
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Grade all ungraded calls'
        required: false
        default: 'false'

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install supabase requests google-genai

      - name: Grade brief calls
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          BACKFILL_FLAG=""
          if [ "${{ github.event.client_payload.backfill || github.event.inputs.backfill }}" = "true" ]; then
            BACKFILL_FLAG="--backfill"
          fi
          python -m backend.grading.grade_brief_calls $BACKFILL_FLAG
