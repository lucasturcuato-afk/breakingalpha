name: Brief Call Grading

on:
  schedule:
    # GitHub cron is UTC. 02:00 UTC is 10pm ET (EDT) / 9pm ET (EST), ~6h after
    # the 4pm ET close, late enough that Tiingo has published the session's final
    # daily bar. 22:00 UTC was only ~2.5h post-close, before publish, which graded
    # a whole same-session batch ungradable (see PR #571). The day-of-week is
    # 2-6 (Tue-Sat), not 1-5, because 02:00 UTC falls on the calendar day AFTER
    # the session it targets: Sat 02:00 UTC grades Friday's session, and no run
    # fires on a Sunday evening (the dropped Monday slot) with nothing to grade.
    # Correct under the live HORIZON_GRADING_MODE=active, whose due-scan selects
    # resolve_on <= today (UTC). CAVEAT: in the legacy off mode selection is
    # brief_date == today, and at 02:00 UTC the UTC date has already rolled to the
    # next day, so an off-mode run would miss the prior session; revisit the hour
    # if the mode is ever set back to off.
    # Live-forward only: the grader has no backfill mode by design (grading old
    # calls produces false verdicts), so there is no backfill input anymore.
    - cron: '0 2 * * 2-6'
  repository_dispatch:
    types: [grade-brief]
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install supabase requests google-genai

      - name: Grade brief calls
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HORIZON_GRADING_MODE: ${{ vars.HORIZON_GRADING_MODE }}
        run: python -m backend.grading.grade_brief_calls

      - name: Grade due user claims
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m backend.grading.grade_user_claims
