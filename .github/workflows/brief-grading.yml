name: Brief Call Grading

on:
  schedule:
    # GitHub cron is UTC. 22:00 UTC weekdays targets after the US market close:
    # 6pm ET during EDT, 5pm ET during EST. DST shifts the ET hour by one, but
    # both land after the 4pm ET close so the same-session daily candle is final.
    # Live-forward only: the grader has no backfill mode by design (grading old
    # calls produces false verdicts), so there is no backfill input anymore.
    - cron: '0 22 * * 1-5'
  repository_dispatch:
    types: [grade-brief]
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install supabase requests google-genai

      - name: Grade brief calls
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HORIZON_GRADING_MODE: ${{ vars.HORIZON_GRADING_MODE }}
        run: python -m backend.grading.grade_brief_calls

      - name: Grade due user claims
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m backend.grading.grade_user_claims
