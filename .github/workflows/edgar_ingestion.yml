name: EDGAR Ingestion (30-min)

# Cron schedule intentionally omitted — enable after manual verification:
#   schedule:
#     - cron: '*/30 * * * *'
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes)'
        type: boolean
        default: false
      no_sync:
        description: 'Skip CIK mapping sync'
        type: boolean
        default: false
      max_ciks:
        description: 'Cap CIKs polled (for testing)'
        type: string
        default: ''

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: pip install beautifulsoup4
      - name: Run EDGAR ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          PYTHONPATH=. python3 backend/ingest_sec.py \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ inputs.no_sync == 'true' && '--no-sync' || '' }} \
            ${{ inputs.max_ciks != '' && format('--max-ciks {0}', inputs.max_ciks) || '' }}
